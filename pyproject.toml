[build-system]
requires = ["setuptools>=64", "setuptools_scm>=7"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-cellposesam"
description = "napari plugin for cellpose and Cellpose-SAM segmentation"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Carsen Stringer", email = "stringerc@janelia.hhmi.org" },
    { name = "Jesko Wagner", email = "35219306+jeskowagner@users.noreply.github.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: BSD License",
    "Framework :: napari",
]
dependencies = [
    "napari>=0.6",
    "magicgui",
    "cellpose>=3",
    "imagecodecs",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/jeskowagner/napari-cellposesam"
"Bug Tracker" = "https://github.com/jeskowagner/napari-cellposesam/issues"
"Upstream" = "https://github.com/MouseLand/cellpose-napari"

[project.optional-dependencies]
docs = [
    "sphinx>=3.0",
    "sphinxcontrib-apidoc",
    "sphinx_rtd_theme",
    "sphinx-prompt",
    "sphinx-autodoc-typehints",
]
testing = [
    "tox",
    "pytest",
    "pytest-cov",
    "pytest-qt",
    "napari",
    "pyqt6",
]

[project.entry-points."napari.manifest"]
napari-cellposesam = "napari_cellposesam:napari.yaml"

[tool.setuptools_scm]
version_file = "napari_cellposesam/_version.py"

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
napari_cellposesam = ["napari.yaml"]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py{311,312,313}-{linux,macos,windows}
isolated_build = true
toxworkdir = /tmp/.tox

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform =
    macos: darwin
    linux: linux
    windows: win32
passenv =
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
setenv =
    TORCHINDUCTOR_CACHE_DIR = {envtmpdir}/torchinductor
extras =
    testing
commands = pytest -v --color=yes --cov=napari_cellposesam --cov-report=xml
"""
