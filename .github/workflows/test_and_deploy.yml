# Runs tests on push/PR. On a "v*" tag, builds the package and publishes it to PyPI
# via trusted publishing: https://docs.pypi.org/trusted-publishers/

### test workflow from Talley Lambert's napari-omero! thanks!
# https://github.com/tlambert03/napari-omero/blob/main/.github/workflows/ci.yml

name: tests

on:
  push:
    branches:
      - main
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.platform }} ${{ matrix.python-version }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: tlambert03/setup-qt-libs@v1

      - name: Install Windows OpenGL
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 https://github.com/pyvista/gl-ci-helpers.git
          powershell gl-ci-helpers/appveyor/install_opengl.ps1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools tox tox-gh-actions

      # model weights (~1.2 GB) and sample data are fetched once, with retries, and
      # cached, so tests don't download them mid-run from flaky/slow servers
      - name: Restore cellpose models and sample data
        id: cp-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cellpose
          key: cellpose-assets-v1-${{ runner.os }}

      - name: Fetch cellpose models and sample data
        if: steps.cp-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ~/.cellpose/models
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o ~/.cellpose/models/cpsam https://huggingface.co/mouseland/cellpose-sam/resolve/main/cpsam
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o ~/.cellpose/data.zip https://osf.io/download/s52q3/
          python -m zipfile -e ~/.cellpose/data.zip ~/.cellpose

      - name: Save cellpose models and sample data
        if: steps.cp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cellpose
          key: cellpose-assets-v1-${{ runner.os }}

      - name: Test with tox
        uses: aganders3/headless-gui@v2
        with:
          run: python -m tox
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Codecov
        uses: codecov/codecov-action@v6

  test-cellpose3:
    name: cellpose v3 compat (ubuntu, py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: tlambert03/setup-qt-libs@v1

      - name: Install dependencies (cellpose v3 pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[testing]" "cellpose>=3,<4"

      - name: Restore cellpose models and sample data
        id: cp-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cellpose
          key: cellpose3-assets-v1-${{ runner.os }}

      - name: Fetch cellpose models and sample data
        if: steps.cp-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cellpose/models
          for f in cyto3 size_cyto3.npy; do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o ~/.cellpose/models/$f https://www.cellpose.org/models/$f
          done
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o ~/.cellpose/data.zip https://osf.io/download/s52q3/
          python -m zipfile -e ~/.cellpose/data.zip ~/.cellpose

      - name: Save cellpose models and sample data
        if: steps.cp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cellpose
          key: cellpose3-assets-v1-${{ runner.os }}

      - name: Test with pytest
        uses: aganders3/headless-gui@v2
        with:
          run: pytest -v --color=yes
        env:
          CI: true

  build:
    name: Build distribution
    needs: [test, test-cellpose3]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # setuptools_scm needs the tag history for the version
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/napari-cellposesam
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
