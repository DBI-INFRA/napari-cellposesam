# Runs the install scripts on all three platforms and builds the Windows setup .exe; on a v* tag,
# attaches the .exe to the GitHub release.
# The plugin is installed from this checkout, so the scripts are tested with the code next to them.
# Made with napari-installer-template; update with `copier update -a installer/.copier-answers.yml`.
# Actions are pinned to major versions, which take in their fixes; `copier update` brings in new majors.

name: installer

on:
  pull_request:
    paths:
      - "installer/**"
      - ".github/workflows/installer.yml"
  # the branch the one-line install commands download the scripts from
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
  # new releases of napari, PyTorch, uv or other dependencies can break an install that worked
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: install script, ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    env:
      NAPARI_CELLPOSESAM_SPEC: ${{ github.workspace }}
      NAPARI_CELLPOSESAM_EXTRA_SETUP: 0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools_scm needs the tag history for the version
          persist-credentials: false

      # the runner context is not available in the job's env
      - name: Set the install folder
        shell: bash
        run: echo "NAPARI_CELLPOSESAM_HOME=$RUNNER_TEMP/plugin-install" >> "$GITHUB_ENV"

      - uses: tlambert03/setup-qt-libs@v1

      # the OpenGL of the Windows runners is too old for napari; this swaps in Mesa's software renderer
      - name: Install Windows OpenGL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP install_opengl.ps1
          Invoke-WebRequest -OutFile $script https://raw.githubusercontent.com/pyvista/gl-ci-helpers/d1c3a005634166a4acee81e8e0446e528ffbd0a9/appveyor/install_opengl.ps1
          powershell -File $script

      - name: Install (macOS, Linux)
        if: runner.os != 'Windows'
        run: sh installer/install.sh

      # Windows PowerShell 5.1, which the one-liner and the setup .exe use
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./installer/install.ps1

      - name: Run again to update (macOS, Linux)
        if: runner.os != 'Windows'
        run: sh installer/install.sh

      - name: Run again to update (Windows, PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./installer/install.ps1

      - name: Check that napari opens with the widget
        uses: aganders3/headless-gui@v2
        with:
          run: ${{ runner.temp }}/plugin-install/${{ runner.os == 'Windows' && 'env/Scripts/python.exe' || 'env/bin/python' }} installer/check_install.py

      - name: Uninstall (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          sh installer/install.sh --uninstall
          test ! -e "$NAPARI_CELLPOSESAM_HOME"

      - name: Uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./installer/install.ps1 -Uninstall
          if (Test-Path $env:NAPARI_CELLPOSESAM_HOME) { throw 'install folder is still there' }
          if (Test-Path "$([Environment]::GetFolderPath('Desktop'))\napari-cellposesam.lnk") { throw 'desktop shortcut is still there' }

  # The runner images have libxcb-cursor0; a fresh Ubuntu desktop does not, so the script adds it.
  # Ubuntu also comes without curl, so the script downloads uv with wget.
  ubuntu-desktop:
    name: install script, Ubuntu desktop libraries
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      NAPARI_CELLPOSESAM_EXTRA_SETUP: 0
    steps:
      - name: Install what Ubuntu desktop has, plus a virtual display
        run: |
          apt-get update -qq
          apt-get install -y -qq wget ca-certificates git xvfb xauth libglib2.0-0t64 libgl1 libgl1-mesa-dri \
            libegl1 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-randr0 libxcb-xkb1 libxcb-xinput0
          if dpkg -s libxcb-cursor0 > /dev/null 2>&1; then echo 'libxcb-cursor0 is installed'; exit 1; fi
          if command -v curl; then echo 'curl is installed'; exit 1; fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # the script comes through standard input, as with `wget -qO- <url> | sh`
      - name: Install
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          NAPARI_CELLPOSESAM_SPEC="$GITHUB_WORKSPACE" sh < installer/install.sh

      - name: Check that napari opens with the widget
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ~/.local/share/napari-cellposesam/env/bin/python installer/check_install.py

  windows-setup:
    name: Windows setup .exe
    runs-on: windows-latest
    env:
      NAPARI_CELLPOSESAM_SPEC: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build the setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
              choco install innosetup -y --no-progress
              $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = (git describe --tags --always) -replace '^v', ''
          iscc /DAppVersion=$version installer/windows/napari-cellposesam.iss

      # from PowerShell 7, so the setup's Windows PowerShell inherits PowerShell 7's module path
      - name: Run the setup silently
        shell: pwsh
        run: |
          $setup = Start-Process installer/windows/Output/napari-cellposesam-setup.exe -Wait -PassThru `
              -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon', '/LOG=setup.log'
          Get-Content setup.log -Tail 20
          if ($setup.ExitCode -ne 0) {
              Get-Content "$env:LOCALAPPDATA\napari-cellposesam\install.log" -ErrorAction SilentlyContinue
              throw "setup failed with exit code $($setup.ExitCode)"
          }
          & "$env:LOCALAPPDATA\napari-cellposesam\env\Scripts\python.exe" -c "import napari, napari_launcher"
          if ($LASTEXITCODE -ne 0) { throw 'the installed environment does not work' }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\napari-cellposesam.lnk")) { throw 'no desktop shortcut' }

      - name: Uninstall silently
        shell: pwsh
        run: |
          Start-Process "$env:LOCALAPPDATA\napari-cellposesam\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
          # the uninstaller finishes deleting itself in the background
          for ($i = 0; ($i -lt 60) -and (Test-Path "$env:LOCALAPPDATA\napari-cellposesam"); $i++) { Start-Sleep 1 }
          if (Test-Path "$env:LOCALAPPDATA\napari-cellposesam") { throw 'install folder is still there' }
          if (Test-Path "$([Environment]::GetFolderPath('Desktop'))\napari-cellposesam.lnk") { throw 'desktop shortcut is still there' }

      - uses: actions/upload-artifact@v7
        with:
          name: napari-cellposesam-setup
          path: installer/windows/Output/napari-cellposesam-setup.exe
          if-no-files-found: error

  # the only job that can write to the repository, and it runs no code from it
  release:
    name: attach the setup to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: napari-cellposesam-setup

      # creates the release for the tag if there is none yet, otherwise adds the .exe to it
      - name: Attach the setup to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" napari-cellposesam-setup.exe --clobber
          else
            gh release create "$TAG" napari-cellposesam-setup.exe --generate-notes --verify-tag
          fi
